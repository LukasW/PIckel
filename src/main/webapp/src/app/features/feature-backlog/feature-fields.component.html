<label class="flex flex-col gap-1 text-sm sm:col-span-2">
  Titel
  <input
    [formControl]="form().controls.title"
    [attr.aria-invalid]="hasError('title', 'required') || hasError('title', 'maxlength')"
    class="rounded border border-border bg-background px-2 py-1"
  />
  @if (hasError('title', 'required')) {
    <span class="text-danger">Der Titel darf nicht leer sein.</span>
  }
  @if (hasError('title', 'maxlength')) {
    <span class="text-danger"
      >Der Titel darf höchstens {{ maxTitleLength }} Zeichen lang sein.</span
    >
  }
</label>
<label class="flex flex-col gap-1 text-sm sm:col-span-2">
  Beschreibung
  <textarea
    [formControl]="form().controls.description"
    rows="3"
    [attr.aria-invalid]="hasError('description', 'maxlength')"
    class="rounded border border-border bg-background px-2 py-1"
  ></textarea>
  @if (hasError('description', 'maxlength')) {
    <span class="text-danger"
      >Die Beschreibung darf höchstens {{ maxDescriptionLength }} Zeichen lang sein.</span
    >
  }
</label>
<label class="flex flex-col gap-1 text-sm">
  WSJF-Rang
  <input
    [formControl]="form().controls.wsjfRank"
    inputmode="numeric"
    [attr.aria-invalid]="hasError('wsjfRank', 'integer')"
    class="rounded border border-border bg-background px-2 py-1"
  />
  @if (hasError('wsjfRank', 'integer')) {
    <span class="text-danger">Der WSJF-Rang muss eine ganze Zahl ab 1 sein.</span>
  }
</label>
<label class="flex flex-col gap-1 text-sm">
  Owner
  <input
    [formControl]="form().controls.owner"
    [attr.aria-invalid]="hasError('owner', 'maxlength')"
    class="rounded border border-border bg-background px-2 py-1"
  />
  @if (hasError('owner', 'maxlength')) {
    <span class="text-danger"
      >Der Owner darf höchstens {{ maxOwnerLength }} Zeichen lang sein.</span
    >
  }
</label>
<label class="flex flex-col gap-1 text-sm">
  Schätzung (Story Points)
  <input
    [formControl]="form().controls.estimate"
    inputmode="numeric"
    [attr.aria-invalid]="hasError('estimate', 'integer')"
    class="rounded border border-border bg-background px-2 py-1"
  />
  @if (hasError('estimate', 'integer')) {
    <span class="text-danger">Die Schätzung muss eine ganze Zahl ab 0 sein.</span>
  }
</label>
