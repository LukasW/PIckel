# Application
quarkus.application.name=pikel

# Quinoa - Angular SPA integration
quarkus.quinoa.ui-dir=src/main/webapp
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.19.0
quarkus.quinoa.build-dir=dist/pikel/browser
quarkus.quinoa.dev-server.port=4200
quarkus.quinoa.dev-server.check-path=/index.html
quarkus.quinoa.dev-server.check-timeout=60000
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.package-manager=npm
# Vitest läuft über das exec-maven-plugin (Phase test), nicht über Quinoa
quarkus.quinoa.run-tests=false

# HTTP
quarkus.http.port=8080

# Database - PostgreSQL
# Dev Services starten in dev und test einen PostgreSQL-Container (Podman oder Docker).
# In prod kommen URL und Zugang aus QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME und
# QUARKUS_DATASOURCE_PASSWORD (bewusst nicht hier, sonst greifen die Dev Services im SmokeIT nicht).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17

# Hibernate ORM: Liquibase verwaltet das Schema, Hibernate prüft nur
quarkus.hibernate-orm.schema-management.strategy=validate

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml

# Test
%test.quarkus.http.test-port=0

# OpenAPI / Swagger UI (dev: /q/swagger-ui)
quarkus.smallrye-openapi.info-title=PIkel API
