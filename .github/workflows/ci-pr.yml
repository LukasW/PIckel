name: CI (PR)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret-Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pfade mit hohem Risiko (Schema, Pipeline, Agenten-Konfiguration, Abhängigkeiten) bekommen das Label
  # needs-human-review. /flow-ship merged solche PRs nie ohne ausdrückliche Freigabe, der Nachtlauf gar nicht.
  risk-paths:
    name: Risiko-Pfade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Label needs-human-review setzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          risky=$(printf '%s\n' "$changed" | grep -E '^(src/main/resources/db/|\.github/|\.claude/|\.agents/|CLAUDE\.md$|pom\.xml$|src/main/webapp/package(-lock)?\.json$)' || true)
          if [ -n "$risky" ]; then
            echo "Risiko-Pfade geändert:"; printf '  %s\n' $risky
            gh label create needs-human-review --color B60205 \
              --description "Risiko-Pfad geändert, Merge nur nach menschlichem Review" 2>/dev/null || true
            gh pr edit "$PR" --add-label needs-human-review
          fi

  # Code ohne nachgeführte Story, nicht eingepflegtes Delta oder Szenarien, die nicht zur .feature-Datei passen:
  # rot. Nur ein Mensch übersteuert mit dem Label spec-unchanged.
  spec-drift:
    name: Spec-Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Story, Delta und Features gegen den Code prüfen
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'spec-unchanged') }}
        run: bash .claude/flow/scripts/check-story-drift.sh

      - name: Übersteuert mit Label spec-unchanged
        if: ${{ contains(github.event.pull_request.labels.*.name, 'spec-unchanged') }}
        run: echo "Spec-Drift-Prüfung durch Label spec-unchanged übersteuert."

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: src/main/webapp/package-lock.json

      - name: Pin npm version
        run: npm install -g npm@11.17.0

      - name: Install frontend dependencies
        working-directory: src/main/webapp
        run: npm ci

      - name: Skills gegen agentskills.io prüfen
        run: bash scripts/check-skills.sh

      - name: ADR-Index aktuell
        run: bash scripts/adr-index.sh --check

      - name: Label- und Push-Guard gegen bekannte Umgehungen prüfen
        run: |
          bash .claude/flow/scripts/test-guard-labels.sh
          bash .claude/flow/scripts/test-guard-push.sh
          bash .claude/flow/scripts/test-issue-cost.sh

      - name: Bekannte Schwachstellen in npm-Abhängigkeiten (Laufzeit, ab high)
        working-directory: src/main/webapp
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend format check (Prettier)
        working-directory: src/main/webapp
        run: npm run format:check

      - name: Backend format check (Spotless)
        run: ./mvnw spotless:check -B

      - name: Backend + Frontend unit tests (inkl. ArchUnit)
        run: ./mvnw test -B

      - name: Mutation Testing domain/ + application/ (PIT)
        run: ./mvnw test-compile -B -Pmutation

  integration:
    name: Integration + Smoke
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: src/main/webapp/package-lock.json

      - name: Pin npm version
        run: npm install -g npm@11.17.0

      - name: Install frontend dependencies
        working-directory: src/main/webapp
        run: npm ci

      - name: CucumberIT + SmokeIT (Dev-Services-PostgreSQL)
        run: ./mvnw verify -B -DskipFrontendTests=true

      # Nur bauen, nicht veröffentlichen: Ein kaputtes Dockerfile soll im PR auffallen, nicht beim ersten Deployment.
      - name: Container-Image bauen
        run: docker build -f src/main/docker/Dockerfile.jvm -t pikel-jvm:ci .
