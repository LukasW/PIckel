name: CI (PR)

on:
  pull_request:
    branches: [main]

jobs:
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: src/main/webapp/package-lock.json

      - name: Pin npm version
        run: npm install -g npm@11.17.0

      - name: Install frontend dependencies
        working-directory: src/main/webapp
        run: npm ci

      - name: Frontend format check (Prettier)
        working-directory: src/main/webapp
        run: npm run format:check

      - name: Backend + Frontend unit tests
        run: ./mvnw test -B

  integration:
    name: Integration + Smoke
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: src/main/webapp/package-lock.json

      - name: Pin npm version
        run: npm install -g npm@11.17.0

      - name: Install frontend dependencies
        working-directory: src/main/webapp
        run: npm ci

      - name: CucumberIT + SmokeIT (Dev-Services-PostgreSQL)
        run: ./mvnw verify -B -DskipFrontendTests=true
